  overhead_slabs:
    - { max_budget_cr: 2.0, overhead_pct: 12.0 }
    - { max_budget_cr: 10.0, overhead_pct: 10.0 }
    - { max_budget_cr: 999999, overhead_pct: 8.0 }
  profit_pct: 10.0

cost_breakdown_shares:
  labour_share: 0.25
  material_share: 0.55
  equipment_share: 0.12
  fuel_share: 0.08

crashing_factors:
  equipment_mobilization_pct: 0.03
  shift_overtime_premium_pct: 0.15
  supervision_per_front_pct: 0.02
  site_congestion_factor_pct: 0.01

acceleration_step_costs:
  site_establishment_per_front_day: 18000
  resident_staff_per_front_day: 12000
  plant_hire_billing_days: 30
  gang_interference_pct: 0.04

re_sequencing_acceleration:
  plant_redeployment_pct: 0.08
  concurrency_congestion_pct: 0.02

sdb_rate_oncost:
  road:
    overhead_pct: 10.0
    contractor_profit_pct: 10.0
  structures:
    overhead_pct: 12.0
    contractor_profit_pct: 10.0
  structure_categories:
    - Superstructure
    - Substructure
    - MEP

# =============================================================================
# Escalation
# =============================================================================
escalation:
  enabled: false
  annual_rate_pct: 5.0
  source: ""
  contract_escalation_clause: ""

# =============================================================================
# Major plant
# =============================================================================
major_plant: [tower_crane_electric, batching_plant_30cum]
major_plant_max_units: 1

# =============================================================================
# Staggered handover chains (floor-by-floor: frame leads finishing by ~4 weeks)
# =============================================================================
staggered_handover_chains: []

