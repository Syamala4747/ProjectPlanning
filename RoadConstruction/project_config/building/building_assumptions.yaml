# =============================================================================
# Direct unit rates â€” 2026 Hyderabad indicative (CPWD DSR 2021 basis)
# =============================================================================
# These are BARE CPWD/DSR rates: material + labour + plant at the source
# price level. Wastage, idle losses and statutory OH/profit are added by the
# engine via rate_build_up_mode: resource_build_up + statutory.
# Units must match building_guidelines.json exactly.
direct_unit_rates_inr:
  site_setting_out: 200          # survey, boundary hoarding and signage: Rs 200/sqm plot
  site_clearance: 60             # Rs 60/sqm
  site_mobilization: 500000      # Rs 5 lakh per mobilisation set
  excavation: 280                # Rs 280/cum (soft soil; hard rock extra)
  piling: 9500                   # 600 mm bored cast-in-situ pile: Rs 9,500/m
  pile_testing: 25000            # Rs 25,000/test
  pile_head_chipping: 2500       # Rs 2,500/pile including PCC blinding
  pile_caps: 9500                # RCC M25: Rs 9,500/cum
  column_stumps: 9500            # RCC M25: Rs 9,500/cum
  ground_beams: 9500             # RCC M25: Rs 9,500/cum
  plinth_filling: 280            # Rs 280/cum
  anti_termite: 480              # Rs 480/sqm
  gf_slab: 4000                  # slab-on-grade with DPM/insulation: Rs 4,000/sqm
  gf_columns: 10500              # RCC M30: Rs 10,500/cum
  ff_beams_slab: 10500           # RCC M30: Rs 10,500/cum
  gf_stairs: 10500               # RCC M30: Rs 10,500/cum
  gf_walls: 5800                 # 230 mm brickwork: Rs 5,800/cum
  ff_columns: 10500              # RCC M30: Rs 10,500/cum
  sf_beams_slab: 10500           # RCC M30: Rs 10,500/cum
  ff_stairs: 10500               # RCC M30: Rs 10,500/cum
  ff_walls: 5800                 # 230 mm brickwork: Rs 5,800/cum
  sf_columns: 10500              # RCC M30: Rs 10,500/cum
  roof_beams: 10500              # RCC M30: Rs 10,500/cum
  roof_trusses: 95000            # structural steel trusses/purlins: Rs 95,000/MT
  roof_covering: 480             # sheeting/tiles with insulation: Rs 480/sqm
  sf_walls: 5800                 # 230 mm brickwork: Rs 5,800/cum
  curtain_wall: 4500             # glazed curtain wall: Rs 4,500/sqm
  railings: 5000                 # MS/SS railing: Rs 5,000/m
  doors: 8500                    # average flush/panel door: Rs 8,500/no
  windows: 8500                  # average aluminium/UPVC window: Rs 8,500/no
  electrical: 450                # Rs 450/point
  plumbing: 420                  # Rs 420/m
  sanitary_fittings: 8000        # average WC/basin/sink set: Rs 8,000/no
  internal_plaster: 260          # 12 mm plaster CM 1:4: Rs 260/sqm
  tiling: 900                    # vitrified tiling: Rs 900/sqm laid
  hardware: 8500                 # kitchen/hardware unit: Rs 8,500/no
  internal_painting: 180         # emulsion with putty/primer: Rs 180/sqm
  external_render: 380           # external plaster + texture finish: Rs 380/sqm
  external_works: 650            # landscaping/paving: Rs 650/sqm
  cleaning_handover: 75          # final cleaning/snagging: Rs 75/sqm

