# =============================================================================
# Building Construction Assumptions â€” Residential (CPWD DSR 2021 / Telangana)
# =============================================================================
# Source basis:
#   - CPWD DSR 2021 (Delhi rates, Hyderabad region adjustment factor 0.95)
#   - IS 456, IS 1905, IS 732, IS 1641, NBC 2016
#   - Minimum Wages Act, Telangana Zone I (2026)
# All rates are indicative 2026 Hyderabad/Telangana delivered-to-site.
# =============================================================================

meta:
  project_type: building
  building_type: residential
  currency: INR
  currency_symbol: Rs
  large_unit: crore
  large_unit_value: 10000000
  effective_date: "2026-11-02"
  version: "2.0"
  source_basis: >
    CPWD DSR 2021 + IS codes + NBC 2016. Rates are indicative 2026
    Hyderabad/Telangana; verify against current state SoR before tendering.

sources:
  direct_unit_rates_inr: "CPWD DSR 2021 (Hyderabad region) Ã— 0.95 factor; adjusted to Nov-2026"
  labour_rates_inr_per_day: "Minimum Wages Act, Telangana Zone I, Jul-2026 notification Ã— 1.5 loaded"
  material_rates_inr: "CPWD DSR 2021 + local trade quotations, Nov-2026 Hyderabad"
  equipment_hire_inr_per_day: "CPWD DSR 2021 equipment schedule, escalated to Nov-2026"

calendar:
  working_days_per_week: 6
  productive_hours_per_day: 8
  equipment_hours_per_day: 9
  holidays_per_year: 14
  monsoon_months: [6, 7, 8, 9]
  monsoon_productivity_factor: 0.65
  hilly_productivity_factor: 1.0   # buildings always on flat/prepared ground
  night_shift_productivity_factor: 0.80
  night_shift_cost_multiplier: 1.50

# Activities eligible for night shift work on building projects
night_work_eligible:
  - bld_004   # excavation
  - bld_005   # foundation RCC
  - bld_006   # frame RCC (slab pours often extend overnight)

# Building geometric parameters (all ratios are per sqm of built-up area)
building_parameters:
  foundation_rcc_per_sqm: 0.35      # cum RCC per sqm BUA (footings + raft + PCC)
  frame_rcc_per_sqm: 0.40           # cum RCC per sqm BUA (columns + beams + slabs)
  masonry_per_sqm: 0.18             # cum brickwork per sqm BUA
  plaster_area_factor: 3.5          # sqm plaster per sqm BUA (walls both sides + ceiling)
  waterproofing_area_factor: 0.30   # terrace + toilet wet areas
  flooring_area_factor: 1.0         # 100% of BUA
  painting_area_factor: 4.0         # sqm paint per sqm BUA (all surfaces)
  external_works_factor: 0.50       # sqm external works per sqm site area
  floor_area_ratio: 1.5             # for estimating site area from BUA
  basement_excavation_depth_m: 3.5

# When true, the CPWD DSR direct rate is used directly as the planned rate.
# This bypasses the resource build-up (correct for published all-in rate books).
use_direct_rate_as_planned: true

# Parallelism control
crew_multiplier_cap: 4

