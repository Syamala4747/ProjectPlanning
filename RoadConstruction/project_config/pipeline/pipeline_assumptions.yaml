- predecessor_id: ACT-05
  successor_id: ACT-14
- predecessor_id: ACT-05
  successor_id: ACT-17
- predecessor_id: ACT-14
  successor_id: ACT-15
- predecessor_id: ACT-18
  successor_id: ACT-19
duration_and_cost_calculation:
  duration_formula: ceil(quantity / (activity_master.productivity_rate * assigned_crews * applicable_productivity_factor))
  labour_cost: sum(crew_trade_count * labour_rate_per_day) * activity_duration_working_days
  equipment_cost: sum(equipment_hire_rate_per_day * equipment_units) * equipment_duration_days
  fuel_cost: equipment_hours_per_day * fuel_consumption_lph * equipment_units * diesel_rate * operating_days
  material_cost: 'included in the published bare direct rate; planned rate adds statutory OH/profit and wastage is a separate direct-cost line (rate_build_up_mode: source_plus_oncosts)'
  calendar_rule: ProjectCalendar converts effort days to calendar days (6-day week, 14 holidays/year,
    monsoon factor).
  productivity_source: Pipeline Activity Master productivity_rate / base_crews.
  dependency_rule: Pipeline Activity Master predecessors; strata branches run in parallel and pipe-material
    branches are alternatives.
  scope_boundary: Facilities (intake, WTP, CWR, OHT, allied E&M) are in scope only when the scheme inputs
    are non-zero.
