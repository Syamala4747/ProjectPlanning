  plant_idle_pct: 0.05
  labour_idle_pct: 0.04
# The pipeline source-plus-oncosts rate embeds these allowances. They are
# reported separately as memo amounts and are not charged a second time.
report_embedded_wastage: false
statutory_and_overheads:
  overhead_slabs:
  - max_budget_cr: 5.0
    overhead_pct: 10.0
  - max_budget_cr: 20.0
    overhead_pct: 8.0
  - max_budget_cr: 999999
    overhead_pct: 7.5
  profit_pct: 10.0
# Pipeline estimates use a fixed project overhead basis. This explicit
# pipeline-only setting takes precedence over the legacy budget slabs above.
cost_parameters:
  overhead_percentage: 8.0
cost_breakdown_shares:
