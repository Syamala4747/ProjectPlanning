    overhead_pct: 8.0
    contractor_profit_pct: 10.0
  structures:
    overhead_pct: 10.0
    contractor_profit_pct: 10.0
  structure_categories:
  - Structures and Fittings
  - Concrete Works
  note: 'Not applied when rate_oncost_basis is statutory: the planned rate adds
    the project overhead/profit slab directly instead of the road SDB multiplier.'
escalation:
  enabled: true
  source_status: provisional
  source: 'Provisional planning indices; contract index source pending confirmation'
  contract_escalation_clause: 'Provisional only; replace with the executed contract escalation clause before award'
  method: spend_curve_midpoint
  base_date: '2026-11-02'
  annual_rates:
    material: 0.04
    labour: 0.05
    plant: 0.03
    fuel: 0.06
  default_annual_rate: 0.045
  cap_pct_of_base: null
  disclose_in_report: true
  note: Provisional planning escalation only. Replace the source, clause and weights with verified contract
    documents before issuing a bid or payment certificate.
