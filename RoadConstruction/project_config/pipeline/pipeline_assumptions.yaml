  maximum_excavators: 2
  maximum_jcb: 3
  maximum_tippers: 4
  maximum_pipe_laying_crews: 3
  maximum_fusion_or_jointing_crews: 2
  maximum_light_cranes: 2
  maximum_dewatering_pumps: 3
  maximum_testing_crews: 2
pipeline_material_inputs:
  pipe_rate_by_material_diameter_and_class_inr_per_m: {}
  fittings_rate_by_type_and_diameter_inr: {}
  valve_rate_by_type_and_diameter_inr: {}
  jointing_material_rate_by_joint_type_inr: {}
  bedding_sand_rate_inr_per_m3: 2000
  selected_backfill_rate_inr_per_m3: 500
  warning_tape_rate_inr_per_m: null
  route_marker_rate_inr_each: null
  disinfectant_rate_inr_per_kg: null
  note: Only bedding sand and selected granular rates are referenced from the road assumptions. Confirm whether
    the project specification calls for these materials and use actual delivered rates.
pipeline_specific_norms:
  trench_excavation_quantity_formula: pipeline_length_m * trench_width_m * average_trench_depth_m
  trench_width_m: null
  average_trench_depth_m: null
  bedding_thickness_m: null
  pipe_surround_thickness_m: null
  pipe_joint_type: null
  hydrotest_section_length_m: null
  hydrotest_pressure_bar: null
  hydrotest_duration_hours: null
  flushing_required: true
  disinfection_required: true
  road_reinstatement_area_sqm: null
cost_parameters:
  sdb_rate_oncost:
    road:
      overhead_pct: 8.0
      contractor_profit_pct: 10.0
    structures:
      overhead_pct: 20.0
      contractor_profit_pct: 10.0
    structure_categories:
    - Structures
  wastage:
    cement: 0.03
    steel: 0.03
    aggregate: 0.05
    sand: 0.05
    bitumen: 0.02
    concrete: 0.04
    bricks: 0.05
    paint: 0.05
    tiles: 0.05
    waterproofing: 0.03
    mortar: 0.05
    default: 0.03
  wastage_non_material:
    fuel_idle_pct: 0.08
    plant_idle_pct: 0.06
    labour_idle_pct: 0.04
  escalation:
    enabled: true
    source: WPI (OEA/DPIIT, base 2011-12) sub-indices; CPI-IW All-India (MoSPI); IOCL ex-refinery VG-40
    contract_escalation_clause: null
    index_formula: 'annual compounding: factor = (1 + r)^years to mid-point of spend'
    material_index: WPI Manufactured Products & General Materials
    labour_index: CPI-IW All-India Industrial Labour
    plant_index: WPI Construction Machinery & Heavy Equipment
    fuel_index: WPI High Speed Diesel / Energy
    weights: cost_breakdown_shares in assumptions (labour/material/plant/fuel)
    base_date: '2026-10-01'
    annual_rates:
      material: 0.04
      labour: 0.05
      plant: 0.03
      fuel: 0.06
    default_annual_rate: 0.045
    index_overrides:
      bitumen:
        annual: 0.065
        note: Based on IOCL ex-refinery VG-40 price trajectory linked to crude oil trends.
      steel:
        annual: 0.048
        note: Based on WPI Mild Steel - Long Products sub-index growth trend.
    method: spend_curve_midpoint
    cap_pct_of_base: null
    excluded:
    - site_mobilization
    - toll_plaza_atms
    - utility_shifting
    disclose_in_report: true
  cost_breakdown_shares:
    labour_share: 0.18
    material_share: 0.54
    equipment_share: 0.18
    fuel_share: 0.1
  note: Road-derived cost add-ons are retained as reference settings only. Confirm the applicable water-supply contract/SOR
    treatment before applying overhead, contractor profit, taxes or escalation.
duration_and_cost_calculation:
  duration_formula: ceil(quantity / (activity_master.productivity_rate * assigned_crews * applicable_productivity_factor))
  labour_cost: sum(crew_trade_count * labour_rate_per_day) * activity_duration_working_days
  equipment_cost: sum(equipment_hire_rate_per_day * equipment_units) * equipment_duration_days
  fuel_cost: equipment_hours_per_day * fuel_consumption_lph * equipment_units * diesel_rate * operating_days
  material_cost: material_quantity_per_activity_unit * activity_quantity * material_rate
  calendar_rule: Use the calendar values copied from the road assumptions.
  productivity_source: Use the Productivity Rate and Base Crews from the water pipeline Activity Master; do not
    replace these with road productivity norms.
  dependency_rule: Follow pipeline Activity Master predecessors. Permit sectional overlap only if the execution
    plan supports separate work fronts and testing/backfilling hold points.
  scope_boundary: This assumptions file is for buried/above-ground water transmission and distribution pipeline
    corridor works only; it excludes treatment plants, reservoirs, intake works and pumping-station building/E&M
    packages.
