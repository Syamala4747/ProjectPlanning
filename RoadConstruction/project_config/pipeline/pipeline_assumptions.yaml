meta:
  name: Water Pipeline Construction Assumptions
  version: '1.0'
  status: Pipeline-only planning assumptions
  country: India
  currency: INR
  effective_date: '2026-06-30'
  reference: Common rates and calendar copied from the user's Road Assumptions YAML
  scope: Water transmission and distribution pipeline corridor works only
  excluded_scope:
  - Intake well
  - Raw water pumping station
  - Water Treatment Plant (WTP)
  - Clear Water Reservoir (CWR)
  - OHT/ESR
  - Pump house buildings
  - Substation
  - DG set installation
  - SCADA/PLC building works
