  soil_type: ordinary
  groundwater_condition: normal
  rock_excavation_required: false
  urban_or_rural: rural
  traffic_congestion: low
  existing_utility_congestion: low
  right_of_way_available: true
  dewatering_required: false
  notes: Set these from alignment survey, geotechnical investigation, utility survey and site inspection. Plain/ordinary/normal
    are initial defaults, not confirmed site facts.
productivity_adjustment_factors:
  plain_terrain: 1.0
  hilly_terrain: 0.7
  monsoon: 0.65
  night_shift: 0.8
  rolling_terrain: 0.85
  urban_congestion: 0.75
  high_groundwater: 0.85
  hard_rock: 0.35
  normal_soil: 1.0
  note: Only apply relevant factors to affected activities. The terrain/soil/congestion values not present in the
    road file are provisional engineering assumptions and require calibration.
