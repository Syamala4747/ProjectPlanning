# Generated and audited pipeline assumptions for the 89-activity multi-village scheme.
# Pricing basis: published direct rates plus configured material wastage,
# resource idle losses and statutory overhead + contractor profit
# (rate_build_up_mode: source_plus_oncosts, rate_oncost_basis: statutory).
# Wastage/idle losses are separate direct-cost lines, matching the road model.
# Escalation uses the provisional planning indices below until the contract
# escalation clause and index source are supplied.

meta:
  name: Multi-Village Water Supply Scheme Assumptions
  version: '2.1'
  status: Full-scheme planning assumptions (corridor + optional facilities)
  country: India
  currency: INR
  effective_date: '2026-11-02'
  reference: CPHEEO Manual on Water Supply & Treatment; CPWD DSR 2021 (Hyderabad); IS 456 / 3370 / 4984
    / 8329 / 11682
  scope: 'Multi-village surface-water supply scheme: intake and pumping station, water treatment plant,
    clear water reservoir, transmission and distribution network, overhead service reservoirs, household
    connections, valves/chambers, road reinstatement and allied E&M. Facility packages are quantified
    only when their scheme input is non-zero; a plain main run stays corridor-only.'
  excluded_scope:
  - Land acquisition and statutory clearances
  - Power supply HT line extension up to the project boundary
  - O&M after the defects-liability period
sources:
  direct_unit_rates_inr: CPWD DSR 2021 (Hyderabad region) + CPHEEO Manual Part-III, escalated to a Nov-2026
    Hyderabad price basis. Bare direct rates (materials + labour + plant); statutory OH + contractor
    profit is applied by the source_plus_oncosts build-up; wastage/idle losses
    are priced separately in the direct-cost build-up.
  labour_rates_inr_per_day: Minimum Wages Act, Telangana Zone I, Jul-2026 notification x 1.5 loaded
  material_rates_inr: CPWD DSR 2021 + local trade quotations, Nov-2026 Hyderabad
  equipment_hire_inr_per_day: CPWD DSR 2021 equipment schedule, escalated to Nov-2026
  productivity_rates: CPHEEO / CPWD water-supply planning norms; JCB trench rates corrected to machine
    output
  escalation: No contract escalation clause available; escalation disabled and estimates priced flat at
    the Nov-2026 base.
