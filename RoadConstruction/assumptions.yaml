# Wastage factors — (1 + wastage) on theoretical quantity. These are MATERIAL
# wastage only: a quantity problem, where you must issue more of the material
# because part of it is lost, spoiled or wasted. Each material carries its own
# factor because cement and aggregate are not stored or handled alike.
# Fuel / plant / labour losses are NOT here — see wastage_non_material below.
# Fractions, not percentages: 0.03 means 3%. These were previously entered 100x
# too small (0.0003 = 0.03%), which made the whole wastage allowance a rounding
# error - cement was being issued at 99.97% efficiency.
wastage:
  cement: 0.03
  steel: 0.03
  aggregate: 0.05
  sand: 0.05
  bitumen: 0.02
  concrete: 0.04
  bricks: 0.05
  paint: 0.05
  tiles: 0.05
  waterproofing: 0.03
  mortar: 0.05
  default: 0.03

# -----------------------------------------------------------------------------
# Non-material execution losses — the fuel / plant / labour half of wastage.
#
# These are UTILISATION problems rather than quantity problems. Material wastage
# means "this bag went hard, issue another"; these mean "this machine was
# running but not doing useful work". Each is a fraction of its own base cost
# and is priced from the same day rates / litres-per-hour the bottom-up estimate
# uses, so the allowance and the cost it scales cannot drift apart.
#
#   fuel_idle_pct    — engines idling at site, standby gensets, pump priming
#                      before and after a pour, never reaching rated economy.
#   plant_idle_pct   — breakdowns awaiting a mechanic, machines waiting on fuel
#                      or spares, standing between discrete tasks. Plant hire is
#                      charged per day, so this is recovered as extra hire days.
#   labour_idle_pct  — gangs standing idle waiting on plant, plus the daily
#                      join/leave/retard drag of a churning site.
#
# Fractions, not percentages: 0.08 means 8%. Validated to 0..1 on load.
# -----------------------------------------------------------------------------
wastage_non_material:
  fuel_idle_pct: 0.08
  plant_idle_pct: 0.06
  labour_idle_pct: 0.04

# -----------------------------------------------------------------------------
# Per-unit cost benchmarks (Rs crore) — back-calc scope from cost when the
# dimensional input is missing, and a reality check on the budget.
# -----------------------------------------------------------------------------
per_unit_benchmarks_crore:
  highway_4lane_greenfield_plains_per_km: 15 # ~Rs 15 Cr/km real NHAI 4-lane
  highway_2lane_per_km: 8
  rural_road_per_km: 1.5
  urban_road_per_km: 18
  bridge_river_per_span: 4.0
  building_hospital_per_sqm: 0.004 # Rs 40,000/sqm
  apartment_per_sqm: 0.0015 # Rs 15,000/sqm built-up, mid-spec
  commercial_building_per_sqm: 0.002 # Rs 20,000/sqm
  dam_per_cum: 0.011 # Rs 1.1 lakh/cum of concrete
  data_centre_per_sqm: 0.060 # Rs 6 lakh/sqm (MEP + whitespace)
  railway_per_km: 12 # Rs 12 Cr/km (BG single line, excl land)

# -----------------------------------------------------------------------------
# Major / fixed plant — equipment that does NOT scale linearly with the number
# of parallel gangs (you don't deploy 16 tower cranes for an apartment, or 16
# hot-mix plants for one site). These are capped at `major_plant_max_units`
# regardless of the crew multiplier k. Mobile plant (excavators, tippers,
# rollers, graders, transit mixers, mobile cranes) scales with gangs.
# -----------------------------------------------------------------------------
major_plant:
  - tower_crane_electric
  - hot_mix_plant_120tph
  - wet_mix_plant_150tph
  - batching_plant_30cum
  - concrete_pump_stationary
  - concrete_pump_boom_36m
  - bored_pile_rig_1_5m
  - crawler_crane_50t
  - dg_set_500kva
  - dg_set_125kva
major_plant_max_units: 2
work_front_span_km: 12 # NORMAL (uncrashed) organisation: how much road one
# gang owns. ceil(length / span) gangs run in parallel from day one, so a 25 km
# corridor is never planned as a single gang grinding 7 years of earthwork.
# Crashing may then split the corridor further - up to one front per 3.5 km
# (see corridor_fronts) - before it has to reach for extra shifts.
crew_multiplier_cap:
  6 # never escalate beyond 6 parallel gangs over and above the normal
  # organisation (linear work: highway/road/bridge/dam/railway). The cap
  # bounds escalation, not the baseline: it cannot force a long corridor
  # back down to a single front. A tight cap lets the schedule-fit WARNING
  # fire when the deadline is genuinely infeasible - see eval #12
# Building work runs many parallel subcontractor gangs across floors and zones,
# so the schedule must be allowed to compress to the deadline (cost is invariant
# — k cancels out of labour/equipment/fuel). Without this override every building
# plan overflowed its deadline by years (apartment x1.3, hospital x3.8, shopping
# x19) because the cap=6 calibrated for linear work is far too low for MEP-heavy
# building scopes. k = min(needed_to_fit, cap), so small buildings still get
# small fleets — this only raises the ceiling.
crew_multiplier_cap_by_type:
  apartment: 150
  building: 150
  building_hospital: 150
  data_centre: 150
  dam: 30 # long dam axis — parallel embankment/concrete gangs

# -----------------------------------------------------------------------------
# Bromilow time-cost sanity check: T (working days) ~ K * (C crore)^B
# Calibrated against NHAI EPC awards 2018-2024.
# -----------------------------------------------------------------------------
bromilow:
  highway: { K: 120, B: 0.30 }
  bridge: { K: 130, B: 0.32 }
  building: { K: 100, B: 0.28 }
  generic: { K: 125, B: 0.30 }
  tolerance_pct: 25

# -----------------------------------------------------------------------------
# NEW — Subcontractor sourcing model
# Two patterns: parallel (multiple contractors, same trade) or
# bundled (one contractor, multiple trades).
# Default pool of subcontractors; cold-start performance factor = 1.0
# *** NOT USED BY THE COST MODEL - RESERVED ***
# Sub-contractor pooling / cold-start behaviour is documented here but nothing
# reads it: no activity is modelled as subcontracted. data_loader warns.
# -----------------------------------------------------------------------------
subcontractor_defaults:
  pool:
    [
      "Sub-contractor A",
      "Sub-contractor B",
      "Sub-contractor C",
      "Sub-contractor D",
    ]
  default_pattern: bundled # bundled | parallel
  parallel_threshold_crew_size: 20 # crews larger than this split across contractors
  cold_start_performance_factor: 1.0 # 1.0 = on-benchmark (generic IS norm)
  # contractor_history_path: ./contractor_benchmarks.json  # future phase

# -----------------------------------------------------------------------------
# NEW — Benchmark tolerance. Variance within tolerance => "on-benchmark".
# Above +tolerance => "over-usage"; below -tolerance => "under-usage".
# -----------------------------------------------------------------------------
benchmark_tolerances:
  labour_variance_pct: 10.0
  equipment_variance_pct: 10.0
  material_variance_pct: 10.0
  cost_vs_billed_tolerance_pct:
    5.0 # planned cost may be up to billed value;
    #  within 5% of billed = tight, over = LOSS
  fuel_max_refuels_per_day: 2 # >2 refuels/day on one machine = hard error
  # Planned estimate vs the per_unit_benchmarks_crore figure for this road type.
  # Outside +/-this, the plan is reported as materially off-benchmark.
  estimate_vs_benchmark_pct: 25.0

# *** NOT USED BY THE COST MODEL - REDUNDANT, DO NOT ADD ON TOP ***
# These weights (3% + 6% + 10% = 19%) restate what `sdb_rate_oncost` already
# applies as OH 8% + CP 10% = x1.188. Charging both would double count the
# on-costs. Keep for reference only. data_loader warns.
# ---
overhead_weights:
  pre_construction: 0.03
  site_overhead_pmo: 0.06
  contractor_margin_contingency: 0.10
  # execution activities share the remaining ~0.81

# -----------------------------------------------------------------------------
# *** NOT USED BY THE COST MODEL - RESERVED ***
# Freight/haulage parameters are documented here but nothing reads them.
# Material rates in `material_rates_inr` are already delivered-to-site prices,
# so hauling is inside the material rate, not priced again here.
# data_loader warns.
# -----------------------------------------------------------------------------
vehicle_transport:
  fuel_consumption_kmpl:
    Truck: 4.0
    Tractor: 3.0
    Trailer: 2.5
    Lorry: 3.5
    Mini_Truck: 6.0
  driver_daily_wage_inr:
    Truck: 1300
    Tractor: 1200
    Trailer: 1500
    Lorry: 1300
    Mini_Truck: 1100
  base_hire_inr_per_km:
    Truck: 15
    Tractor: 20
    Trailer: 25
    Lorry: 18
    Mini_Truck: 10
  loading_unloading_hours: 2.0
  average_speed_kmph: 40
  min_distance_km: 50
  max_distance_km: 500

# -----------------------------------------------------------------------------
# 4-LANE EPC NATIONAL HIGHWAY GEOMETRIC & ENGINEERING PARAMETERS (IRC:SP:84 / MoRTH)
