# IRC GEOMETRIC STANDARDS BY LANE CONFIGURATION
# Sourced from: IRC:86-2018 Table 5.5, IRC:SP:73 (2L), IRC:SP:84 (4L), IRC:SP:87 (6L), IRC:SP:99 (8L)
