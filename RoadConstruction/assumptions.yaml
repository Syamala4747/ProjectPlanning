# =============================================================================
# Assumptions & Standards Layer — Construction Project Planner (standalone)
# =============================================================================
# Single source of truth for every rate, norm, and capacity the planner uses.
# Every downstream number (cost, manpower, machinery, material, fuel) is
# DERIVED from this file — nothing is invented per-project.
#
# Sourced from Indian Standards / Indian regulations:
#   - MoRTH Specifications for Road & Bridge Works (2013) + SDB (2019)
#   - IRC codes (IRC:37, IRC:SP:19, etc.)
#   - IS 456 (RCC), IS 800 (steel), IS 10262 (mix), IS 2386 (agg testing)
#   - CPWD Delhi Schedule of Rates (DSR) — building trades
#   - Minimum Wages Act (Telangana Zone I notification, fully-loaded)
#   - OEM equipment data sheets (fuel burn, tank capacity)
#
# Currency: INR (Rs). "_inr" = rupees. Refresh rates quarterly.
# =============================================================================

meta:
  country: "India"
  currency: "INR"
  currency_symbol: "Rs"
  large_unit: "crore"
  large_unit_value: 10000000
  effective_date: "2026-06-30"
  version: "1.0"

calendar:
  working_days_per_week: 6
  productive_hours_per_day: 8
  equipment_hours_per_day: 9 # 8 productive + 1 idle (MoRTH SDB convention)
  monsoon_months: [6, 7, 8, 9]
  monsoon_productivity_factor: 0.65
  hilly_productivity_factor: 0.70
  night_shift_productivity_factor: 0.80
  night_shift_cost_multiplier: 1.50
  holidays_per_year: 14

# Activities physically able to run a night shift. Surfaces that need a dry
# surface, a temperature window or daylight (prime/tack coat, planting,
# utility/live-traffic work, sign installation) are excluded: a night shift on
# those costs more and delivers less. Anything not listed falls back to a
# single day shift only.
night_work_eligible:
  - excavation
  - embankment
  - subgrade
  - gsb
  - wmm
  - dbm
  - bc
  - box_culverts
  - pipe_culverts
  - bridge_piling
  - bridge_substructure
  - bridge_superstructure
  - flyover_structures
  - vup_structures
  - re_walls
  - drainage
  - slope_protection

# -----------------------------------------------------------------------------
# Labour rates — fully-loaded cost-to-contractor in INR per person per day.
# Includes statutory dues: PF, ESI, bonus, gratuity, leave + site overhead.
# Source: Minimum Wages Act, Telangana Zone I, x1.5 all-loaded multiplier.
# -----------------------------------------------------------------------------
labour_rates_inr_per_day:
  unskilled: 750
  semi_skilled: 900
  skilled: 1200
  highly_skilled: 1400
  equipment_operator: 1800
  driver: 1300
  supervisor: 3500
  site_engineer: 4500
  project_manager: 6500
  qc_technician: 2500
  safety_officer: 2800
  surveyor: 3000
  plumber: 1400
  electrician: 1400
  hvac_technician: 1600
  painter: 1200
  fire_fighting_technician: 1500
  lift_technician: 1800
  aluminium_fabricator: 1400
  glazier: 1400

trade_display_names:
  unskilled: "mazdoor"
  semi_skilled: "semi-skilled"
  skilled: "skilled mason"
  highly_skilled: "bar bender / fitter"
  equipment_operator: "operator"
  driver: "driver"
  supervisor: "supervisor"
  site_engineer: "site engineer"
  project_manager: "project manager"
  qc_technician: "QC tech"
  safety_officer: "safety officer"
  surveyor: "surveyor"
  plumber: "plumber"
  electrician: "electrician"
  hvac_technician: "HVAC tech"
  painter: "painter"
  fire_fighting_technician: "fire-fighting tech"
  lift_technician: "lift tech"
  aluminium_fabricator: "aluminium fab"
  glazier: "glazier"

# *** NOT USED BY THE COST MODEL - RESERVED, DO NOT ASSUME IT IS PRICED ***
# The always-on PMO/site staff are documented here, but nothing reads this
# block. Site overhead is already recovered through `sdb_rate_oncost`
# (OH 8% + CP 10%, inside the all-in planned rate). Adding this crew on top
# would double count it. data_loader warns about this on every run.
# ---
project_overhead_crew:
  - { trade: project_manager, count: 1 }
  - { trade: site_engineer, count: 4 }
  - { trade: supervisor, count: 4 }
  - { trade: qc_technician, count: 3 }
  - { trade: safety_officer, count: 2 }
  - { trade: surveyor, count: 2 }
  - { trade: driver, count: 4 }
  - { trade: unskilled, count: 10 }

