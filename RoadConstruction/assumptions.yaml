# =============================================================================
# PLANNED UNIT RATES — DERIVED, not stored
# =============================================================================
# The planned unit rate for every activity is now DERIVED at run time from the
# first-principles resource build-up in this file: the material recipes
# (material_per_unit / material_per_unit_road), the crew compositions and
# labour day rates (crew_composition / labour_rates_inr_per_day), the plant
# fleet and hire rates (equipment_per_activity / equipment_hire_inr_per_day)
# and the fuel consumption rates (fuel_consumption_lph), all evaluated at the
# natural single-gang, single-shift basis.
#
#   Planning Variation % = (Planned x K − Direct Rate) / Direct Rate x 100
#
# where Direct Rate is the MoRTH SDB rate in `direct_unit_rates_inr` and K is
# the SDB on-cost multiplier from `sdb_rate_oncost` (road x1.188, structures
# x1.32). Both sides are ALL-IN: the MoRTH rate already contains 8%/20%
# overhead + 10% contractor's profit, so our build-up is multiplied by the
# same on-costs before comparing. The variation is a REPORTING number — the
# gap between what the first-principles all-in price says and the MoRTH
# published rate — never an input. If a resource cost changes (cement bag
# price, machine hire, wastage), the planned rate and the variation re-derive
# automatically.
# =============================================================================

# -----------------------------------------------------------------------------
# MASTER ACTIVITY DEFINITIONS & WORK BREAKDOWN
# -----------------------------------------------------------------------------
# NOTE: activity_master has been moved to guidelines.json as the master
# MoRTH specification catalog and is loaded directly from guidelines.json.

# NOTE: material wastage is priced per material from the `wastage` block via the
# recipe in material_per_unit; fuel, plant and labour utilisation losses are in
# `wastage_non_material`. Both surface as the MATERIAL WASTAGE COST / RESOURCE
# LOSS columns on Excel sheet 10. Neither re-prices the estimate — the MoRTH/SDB
# rate remains the basis of the planned direct cost.

