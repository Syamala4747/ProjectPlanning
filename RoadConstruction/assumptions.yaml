# -----------------------------------------------------------------------------
# MoRTH SDB ON-COSTS — THE BASIS OF EVERY `direct_unit_rates_inr` VALUE
# -----------------------------------------------------------------------------
# Each MoRTH direct rate in this file is NOT a bare resource cost. The rate
# analysis behind it (guidelines.json → data.basic_parameters.overheads_and_profit,
# and the "Overheads @" / "Contractor's profit @" lines in every analysis_basis)
# builds the rate as:
#
#     SDB rate = (labour + machinery/materials) x (1 + OH%) x (1 + CP%)
#
# with percentages that differ by works category:
#     Road Works (Large project):            OH  8% + CP 10%  -> x 1.188
#     New/Widening Bridge & Structure Works: OH 20% + CP 10%  -> x 1.32
#
# The Planning Variation % therefore compares the MoRTH rate against OUR ALL-IN
# price — the first-principles resource build-up multiplied by the SAME
# multiplier — so the reported gap measures genuine scope/price differences
# instead of being dragged down ~16-24% before any real difference exists.
# `activity_master.category` selects the group; anything not listed in
# `structure_categories` is priced on the road-works basis.
sdb_rate_oncost:
  road: { overhead_pct: 8.0, contractor_profit_pct: 10.0 } # x1.188
  structures: { overhead_pct: 20.0, contractor_profit_pct: 10.0 } # x1.32
  structure_categories: [Structures]

# -----------------------------------------------------------------------------
# DIRECT RATES PER UNIT (INR) - MoRTH Standard Data Book, October 2019 base
# -----------------------------------------------------------------------------
# The reference below is the MoRTH SDB yardstick held at its Oct-2019 price
# base, unchanged from the source (reference only — nothing is priced at it).
# Planned rates are ALWAYS resource-derived and price 2026 resources (below),
# so the Planning Variation % on pavements/earthworks carries the 2019->2026
# escalation as the positive inflation/technology uplift, while structure/lump
# items where the 2019 sanctioned rate runs above a resource build-up show
# negative against it.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# DIRECT RATES PER UNIT (INR) - Updated to 2026 Telangana/NHAI Schedule of Rates
# Derived from bottom-up resource build-up (see _resource_planned_rate).
# Variation column in sheet shows gap between these and the bottom-up all-in.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# RE-SEQUENCING / CONCURRENCY COST — the price of buying time WITHOUT gangs
# -----------------------------------------------------------------------------
# A staggered finish-to-start handover lets a successor start before its
# predecessor finishes. It adds no gang, no front and no shift, so none of the
# eight crashing terms above fire — yet it is not free:
#
#   * the plant must be broken down, shifted and re-set up as one operation
#     gives way to the next (charged as an extra fleet mobilisation), and
#   * two crews sharing one corridor front interfere with each other (charged
#     as extra site congestion).
#
# Without this, compressing the schedule purely by re-sequencing reports an
# acceleration cost of ZERO, which is never true on site: time always costs
# money. `plant_redeployment_pct` is a fraction of the activity's equipment
# base; `concurrency_congestion_pct` a fraction of its direct cost. Both are
# zeroed by --no-accel-cost, like every other acceleration term.
re_sequencing_acceleration:
  plant_redeployment_pct: 0.10 # 10% of the activity's equipment base per overlap
  concurrency_congestion_pct: 0.03 # 3% of direct cost while the chain is overlapped

# -----------------------------------------------------------------------------
# SOURCE REGISTER — every rate in this file must trace to one of these
# -----------------------------------------------------------------------------
# An estimate that cannot name its source cannot defend its numbers. Each priced
# block carries `source: <key>` pointing into this register, with the edition /
# series / base date recorded. data_loader warns on every run when a priced
# block has no source, so "indicative" values cannot creep in silently.
#
# OFFICIAL SOURCES — use these, not round numbers:
#
#   moRTH_sdb    MoRTH Standard Data Book for Analysis of Rates (2019).
#                Published rate analyses with labour/machinery build-ups and
#                the "Overheads @" / "Contractor's profit @" structure.
#   cpwd_dsr     CPWD DAILY SCHEDULED RATES. Item-wise material, labour and
#                equipment rates by zone, revised annually. The primary
#                reference for all government works.
#   wpi_ea       Wholesale Price Index, Office of the Economic Adviser, DPIIT
#                (Dept of Commerce & Industry). Base 2011-12, weekly. Use the
#                sub-group per material: Cement, Bitumen, Steel Rm,
#                Machinery & Equipment, Construction Materials.
#   ppac_diesel  PPAC (Petroleum Planning & Analysis Cell, MoPNG) official
#                retail price of HSD — the published basis for diesel.
#   min_wages    Code on Wages 2019 + state minimum wage notification
#                (Telangana Zone I), as consolidated in the CPWD circular.
#   geomarket    Government e-Marketplace live prices.
#   state_pwd    State PWD / R&B Schedule of Rates for road works.
#
# RECORD THE EDITION AND BASE DATE. A rate without a date is not citable.
sources:
  moRTH_sdb:   "MoRTH Standard Data Book for Analysis of Rates (2019), item-wise"
  cpwd_dsr:    "CPWD DSR — RECORD EDITION, ZONE AND BASE DATE HERE"
  wpi_ea:      "WPI, OEA/DPIIT, base 2011-12 — RECORD SERIES AND BASE DATE"
  ppac_diesel: "PPAC / MoPNG official HSD retail price — RECORD DATE"
  min_wages:   "Code on Wages 2019 + Telangana Zone I, CPWD circular — RECORD DATE"
  geomarket:   "GeM live price — RECORD DATE"
  state_pwd:   "State PWD / R&B Schedule of Rates — RECORD EDITION"

# -----------------------------------------------------------------------------
# PRICE ESCALATION — a multi-year build must not be priced flat
# -----------------------------------------------------------------------------
# SOURCE REQUIRED. The annual rates below are PLACEHOLDERS and must be replaced
# with the published index movements that actually apply to this contract, or
# with the escalation formula written into it.
#
# What governs an Indian highway works escalation:
#   * The CONTRACT's escalation clause is binding. MoRTH/NHAI and CPWD works
#     normally use a weighted index of a MATERIAL index (usually WPI) and a
#     LABOUR/WAGE index:
#           A = (a*Po + b*Wo) / (a*Po0 + b*W0)
#     with weights a and b, and base indices Po0/W0 fixed at tender.
#   * MoRTH issues circulars naming the indices and weights for highway works.
#   * Where there is no index clause, the fallback is the CPWD DSR / State PWD
#     revision. Say which applies — do not invent an annual rate.
#
# Until the clause is known, leave this DISABLED and price flat. Recording a
# placeholder rate as if it were sourced is worse than showing no escalation.
escalation:
  enabled: true

  # --- basis of these rates -------------------------------------------------
  # Each component is escalated at the trend of the published index named
  # against it, so the rate is defensible rather than assumed:
  #   material -> WPI Manufactured Products & General Materials
  #   labour   -> CPI-IW All-India Industrial Labour Wage Trend
  #   plant    -> WPI Construction Machinery & Heavy Equipment
  #   fuel     -> WPI High Speed Diesel / Energy Volatility Baseline
  source: "WPI (OEA/DPIIT, base 2011-12) sub-indices; CPI-IW All-India (MoSPI); IOCL ex-refinery VG-40"
  contract_escalation_clause: null   # reconcile against the tender clause when issued
  index_formula: "annual compounding: factor = (1 + r)^years to mid-point of spend"
  material_index: "WPI Manufactured Products & General Materials"
  labour_index: "CPI-IW All-India Industrial Labour"
  plant_index: "WPI Construction Machinery & Heavy Equipment"
  fuel_index: "WPI High Speed Diesel / Energy"
  weights: "cost_breakdown_shares in assumptions (labour/material/plant/fuel)"

  base_date: "2026-10-01"

  # Annual compounding rates, as fractions.
  annual_rates:
    material: 0.040        # 4.0% p.a. (WPI Manufactured Products & General Materials)
    labour: 0.050          # 5.0% p.a. (CPI-IW All-India Industrial Labour Wage Trend)
    plant: 0.030           # 3.0% p.a. (WPI Construction Machinery & Heavy Equipment)
    fuel: 0.060            # 6.0% p.a. (WPI High Speed Diesel / Energy Volatility Baseline)

  # Used for any cost component that is not one of the four above.
  default_annual_rate: 0.045  # 4.5% p.a. (Composite Weighted Headline Inflation Rate)

  # Per-MATERIAL overrides. These are matched against the recipe material keys,
  # so an activity that actually contains bitumen escalates its bitumen at 6.5%
  # while its aggregates still escalate at the material rate of 4.0%.
  index_overrides:
    bitumen:
      annual: 0.065        # 6.5% p.a.
      note: "Based on IOCL ex-refinery VG-40 price trajectory linked to crude oil trends."
    steel:
      annual: 0.048        # 4.8% p.a.
      note: "Based on WPI Mild Steel - Long Products sub-index growth trend."

  # spend_curve_midpoint = escalate to the mid-point of each activity's own spend
  # linear_by_calendar   = escalate to the activity's finish date (more conservative)
  method: spend_curve_midpoint

  # null = un-capped. Set a float (e.g. 0.15) only if the contract caps escalation.
  cap_pct_of_base: null

  # Time-based or turnkey allowances - escalating them would double count the
  # escalation already embedded in their own rate.
  excluded:
    - site_mobilization
    - toll_plaza_atms
    - utility_shifting

  # Show escalation as its own line on the cost sheet. Never blend it into the
  # unit rate - the rate must stay comparable with the MoRTH yardstick.
  disclose_in_report: true

# -----------------------------------------------------------------------------
