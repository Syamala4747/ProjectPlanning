# Material recipes per unit of output (IS 456 mix basis / MoRTH SDB)
material_per_unit:
  # NOTE: every rcc_* mix carries ply_shuttering_sqm — centreing & shuttering is
  # part of any cast-in-situ concrete rate (SDB analyses price it inside the RCC
  # item). The shared mix covers box culverts, drainage, sub/superstructure,
  # flyover and VUP. The ONE exception is bridge_pile_m25 (bored pile: no formwork,
  # tremie concrete + temporary casing instead) which is a standalone recipe below.
  rcc_m25:
    cement_kg: 380
    sand_cum: 0.45
    agg_20mm_cum: 0.50
    agg_10mm_cum: 0.30
    steel_kg: 90
    water_litre: 180
    admix_kg: 4.0
    ply_shuttering_sqm: 4.5 # sqm contact area per cum of concrete (walls/piles/footings blend)
  rcc_m30:
    cement_kg: 400
    sand_cum: 0.45
    agg_20mm_cum: 0.50
    agg_10mm_cum: 0.30
    steel_kg: 100
    water_litre: 180
    admix_kg: 4.0
    ply_shuttering_sqm: 4.5
  rcc_m35:
    cement_kg: 430
    sand_cum: 0.42
    agg_20mm_cum: 0.50
    agg_10mm_cum: 0.30
    steel_kg: 120
    water_litre: 170
    admix_kg: 4.5
    ply_shuttering_sqm: 4.5
  gsb:
    agg_well_graded_cum: 1.05
    water_litre: 60
  wmm:
    agg_well_graded_cum: 1.05
    water_litre: 50
  dbm:
    bitumen_kg: 100
    agg_20mm_cum: 0.50
    agg_10mm_cum: 0.30
    agg_6mm_cum: 0.15
  bc:
    bitumen_kg: 130
    agg_20mm_cum: 0.30
    agg_10mm_cum: 0.40
    agg_6mm_cum: 0.25
  brickwork:
    bricks_no: 500
    mortar_cum: 0.25
    water_litre: 100
  plaster:
    cement_kg: 5.5
    sand_cum: 0.012
    water_litre: 25
  waterproofing:
    waterproofing_membrane_sqm: 1.05
    primer_litre: 0.3
  tiling:
    tiles_sqm: 1.05
    tile_adhesive_kg: 4.0
  paint:
    paint_litre: 0.35
    primer_litre: 0.12

# -----------------------------------------------------------------------------
# Road-specific recipes. The building recipes above (rcc_*, brickwork, plaster,
# tiling, paint) are reused by the structure activities, but earthwork, pavement
# and surfacing need their own per-unit consumption figures. Quantities are per
# ONE UNIT OF ACTIVITY OUTPUT, matching the activity unit in activity_master
# (cum / sqm / metre) — so multiply by the activity quantity to get the total.
# -----------------------------------------------------------------------------
material_per_unit_road:
  # Excavation: blended soft+hard soil cut. 70% soft soil (no material cost),
  # 30% hard/rock requiring blasting. Blasting materials (explosives, detonators,
  # drilling rods) are priced as a lump allowance embedded in the rate uplift.
  # The 3% is overbreak allowance on the total cut.
  excavation:
    _waste_only:
      overbreak_pct: 0.03
  # Embankment/subgrade: compacted borrowed material. 1.15 cum loose per cum
  # compacted after shrinkage/swell, less the 3% compaction loss.
  embankment_fill:
    borrow_earth_cum: 1.15
    water_litre: 40
  subgrade:
    borrow_earth_cum: 1.15
    water_litre: 50
  # Granular sub-base / WMM as placed (wet mix, 1.05 loose:1 compacted).
  gsb:
    agg_well_graded_cum: 1.05
    water_litre: 60
  wmm:
    agg_well_graded_cum: 1.05
    water_litre: 50
  # Bituminous courses, per sqm of finished surface. Bituminous mix density is
  # ~2450 kg/cum; bitumen content is 4.5% by weight of mix.
  #   DBM 100mm -> 0.100 x 2450 = 245 kg mix -> 11.0 kg bitumen
  #   BC   50mm -> 0.050 x 2450 = 122 kg mix ->  5.5 kg bitumen
  # Aggregate volumes are the balance of the mix (mix less bitumen less filler),
  # converted to loose cum at ~1650 kg/cum.
  dbm_100mm:
    bitumen_kg: 11.0
    agg_20mm_cum: 0.068
    agg_10mm_cum: 0.046
    agg_6mm_cum: 0.025
  bc_50mm:
    bitumen_kg: 5.5
    agg_20mm_cum: 0.034
    agg_10mm_cum: 0.023
    agg_6mm_cum: 0.013
  prime_coat:
    bitumen_emulsion_kg: 0.80 # MoRTH Cl.502: 0.70-0.90 kg/sqm for primer (was 0.30 — tack coat qty)
  tack_coat:
    bitumen_emulsion_kg: 0.20
  # Structures reuse the IS 456 building mixes above (which now include
  # shuttering); these entries name which. bridge_pile_m25 is the deliberate
  # exception — see its standalone recipe.
  box_culvert_m25: { _use: rcc_m25 }
  bridge_pile_m25: # bored pile: tremie concrete, NO shuttering — rebar cage + amortized casing
    cement_kg: 380
    sand_cum: 0.45
    agg_20mm_cum: 0.50
    agg_10mm_cum: 0.30
    steel_kg: 135 # 110 kg/cum pile rebar + 25 kg/cum amortized temporary casing steel
    water_litre: 180
    admix_kg: 4.0
  bridge_substructure_m35: { _use: rcc_m35 }
  bridge_superstructure_m35: # M45/M50 PSC girder + deck: shared mix PLUS prestressing strand
    # and bearings/expansion joints — the SDB superstructure item prices these
    # inside the rate; without them the build-up sat ~60% below MoRTH.
    cement_kg: 430
    sand_cum: 0.42
    agg_20mm_cum: 0.50
    agg_10mm_cum: 0.30
    steel_kg: 120
    water_litre: 170
    admix_kg: 4.5
    ply_shuttering_sqm: 4.5
    prestressing_strand_kg: 80 # low-relaxation strand, girder stressing
    bridge_bearing_expansion_per_cum: 1.0
  flyover_m35: { _use: rcc_m35 }
  vup_m30: { _use: rcc_m30 }
  drainage_m25: { _use: rcc_m25 }
  # Twin RCC NP4 DN1200 pipe culvert, per METRE RUN of twin culvert (= 2 pipe
  # metres). SDB 9.05 (double row): pipes on granular bedding + sand/cement
  # collar mortar, excl. excavation & headwalls.
  pipe_culvert_twin_m:
    rcc_pipe_dn1200_metre: 2.0
    agg_well_graded_cum: 0.50 # 5.6mm granular bedding & surround
    cement_kg: 12 # collar mortar 1:2
    sand_cum: 0.05
    water_litre: 40
  # Tree felling + 1:10 compensatory afforestation (SDB 11.21 / CAMPA norms):
  # felling itself is crew + plant only; the sanctioned rate pays for plantation.
  tree_felling_no:
    forest_sapling_no: 10 # 10 saplings per felled tree
    plant_guard_no: 5
    afforestation_tending_per_tree: 1
    water_litre: 1500 # establishment watering
  # Median dressing per sqm: topsoil + shrubs + grass turfing & establishment.
  median_dressing_sqm:
    topsoil_cum: 0.08
    shrub_plant_no: 0.12
    grass_seed_kg: 0.04
    fertiliser_kg: 0.12
    water_litre: 200

  # ---------------------------------------------------------------------------
  # NEW — first-principles recipes for the former unmapped_activity_keys, so the
  # planned rate can be DERIVED from resources for the whole activity family.
  # ---------------------------------------------------------------------------
  # Utility shifting: water/telecom ducts + HT line relocation + backfill.
  # The HT portion (conductor, tower steel, insulators) is what the sanctioned
  # ₹1.4 Cr/km line item is dominated by; without it the build-up understated
  # the activity by ~79%.
  utility_shift_km:
    hdpe_pipe_dn600_metre: 1500
    electrical_cable_per_metre: 5000
    conduit_per_metre: 2000
    borrow_earth_cum: 300
    ht_conductor_metre: 4000 # 3-phase HT conductor relocation (~1300 m per phase)
    galvanized_steel_kg: 15000 # tower/pole steel re-erection & replacement
    insulator_string_no: 15
    # Water/sewer mains run with the utility corridor and are part of the
    # sanctioned shifting item (the old recipe relocated only power/telecom).
    di_water_main_metre: 350 # DN200 water main shifted per km of corridor
    plumbing_pipe_per_metre: 800 # gravity sewer segment replacement
    # Pavement reinstatement over the trench runs: granular backfill + bituminous
    # plug over ~1,500 sqm of cut pavement per km.
    agg_well_graded_cum: 260
    agg_10mm_cum: 95
    bitumen_kg: 2900
    bitumen_emulsion_kg: 160
    utility_dismantling_disposal_lump: 1.0
  # Site set-up: camp/office buildings + lab + weighbridges + machinery transport
  # + power/water/safety + THE FULL SANCTIONED SET: workers' camp, batching & hot
  # mix plant erection, internal development, workshops. Without those five lumps
  # the planned rate sat ~57% below the sanctioned mobilization rate because the
  # rate analysis prices a complete site base camp, not just offices.
  site_mobilization_set:
    aac_blocks_per_thousand: 3.0
    bricks_no: 2500
    mortar_cum: 6
    cement_kg: 15000
    steel_kg: 4000
    sand_cum: 18
    electrical_cable_per_metre: 700
    conduit_per_metre: 500
    plumbing_pipe_per_metre: 250
    paint_litre: 120
    water_litre: 20000
    machinery_transport_lump: 1.0
    qa_qc_lab_equipment_set: 1.0
    weighbridge_no: 2.0
    site_establishment_lump: 1.0
    site_power_set: 1.0
    site_water_supply_lump: 1.0
    safety_environment_lump: 1.0
    labour_camp_lump: 1.0
    batching_plant_erection_lump: 1.0
    hotmix_plant_erection_lump: 1.0
    site_internal_development_lump: 1.0
    site_workshop_stores_lump: 1.0
  # RE wall per sqm of face: precast panel (M35) + uniaxial geogrid at ~5 sqm per
  # sqm face (0.7H strip x H/0.75m layers) + select granular reinforced backfill.
  # Backfill is 3.2 cum/sqm — the reinforced-zone wedge behind a ~4 m wall needs
  # 2.5-3.5 cum of granular per sqm of face; the old 1.8 underpriced it.
  re_wall_sqm:
    cement_kg: 60
    steel_kg: 14
    sand_cum: 0.059
    agg_20mm_cum: 0.070
    agg_10mm_cum: 0.042
    select_granular_cum: 3.2
    geogrid_sqm: 5.0
    geotextile_sqm: 1.10
    water_litre: 30
  # Slope protection: 3D geocell + topsoil infill + turfing & establishment.
  slope_protection_sqm:
    topsoil_cum: 0.15
    geocell_sqm: 1.0
    geotextile_sqm: 1.05
    grass_seed_kg: 0.05
    fertiliser_kg: 0.20
    water_litre: 200
  # Service road composite pavement per sqm: 200mm GSB + 200mm WMM + 40mm BC
  # + prime/tack (the old recipe had only ~150mm granular and no prime/tack).
  service_road_composite:
    agg_well_graded_cum: 0.42
    bitumen_kg: 4.4
    agg_20mm_cum: 0.027
    agg_10mm_cum: 0.018
    agg_6mm_cum: 0.010
    bitumen_emulsion_kg: 0.43 # prime 0.25 + tack 0.18
    water_litre: 60
  # Road furniture per km: W-beam barrier + posts (median & both edges),
  # gantries, sign structures, sign faces, hot-applied markings. Steel is
  # FABRICATED + HOT-DIP GALVANIZED (SDB 8.23/10.16), not bare TMT bar — pricing
  # it at ₹60/kg was the main cause of the -78% gap.
  road_furniture_km:
    galvanized_steel_kg: 52000 # W-beam + posts + sign/gantry structures (up from 45t: small gantries & extra posts)
    delineator_set_km: 1.0 # 40 delineators + cat-eyes + milestones
    signage_panel_sqm: 90
    thermoplastic_kg: 5000
    reflective_bead_kg: 400
    paint_litre: 150
    primer_litre: 40
  # Toll plaza + 25km ATMS per set: tolling electronics + THE ATMS FIELD
  # EQUIPMENT (VMS, cameras, RCMS, ITS fibre, ATCC workstations/SCADA — the
  # sanctioned item explicitly covers "25 km ATMS") + booths/canopy civil
  # + plaza civil + building MEP. power_supply_set is the plaza/ATCC
  # electrical infrastructure — NOT part of the electronics lumps.
  toll_plaza_set:
    toll_electronics_system_set: 1.0
    atms_field_equipment_lump: 1.0
    toll_booth_canopy_lump: 1.0
    power_supply_set: 1.0
    cement_kg: 240000
    steel_kg: 48000
    sand_cum: 450
    agg_20mm_cum: 550
    agg_10mm_cum: 350
    bricks_no: 380000
    mortar_cum: 110
    waterproofing_membrane_sqm: 2600
    tiles_sqm: 2200
    tile_adhesive_kg: 8800
    paint_litre: 900
    primer_litre: 300
    electrical_cable_per_metre: 16000
    conduit_per_metre: 10000
    plumbing_pipe_per_metre: 1800
    hvac_duct_per_sqm: 1400
    water_litre: 600000

# -----------------------------------------------------------------------------
# Activity -> recipe map. Which material_per_unit / material_per_unit_road entry
# describes each activity's consumption, and how many units of that recipe one
# unit of activity output consumes (the mix factor). Recipes not listed here are
# explicitly acknowledged in `activity_no_material_recipe` below — a silent
# zero would understate the bottom-up estimate.
# -----------------------------------------------------------------------------
activity_material_recipe:
  excavation: { recipe: excavation, per_output: 1.0 }
  embankment: { recipe: embankment_fill, per_output: 1.0 }
  subgrade: { recipe: subgrade, per_output: 1.0 }
  gsb: { recipe: gsb, per_output: 1.0 }
  wmm: { recipe: wmm, per_output: 1.0 }
  dbm: { recipe: dbm_100mm, per_output: 1.0 }
  bc: { recipe: bc_50mm, per_output: 1.0 }
  prime_coat: { recipe: prime_coat, per_output: 1.0 }
  tack_coat: { recipe: tack_coat, per_output: 1.0 }
  box_culverts: { recipe: box_culvert_m25, per_output: 1.0 }
  bridge_piling: { recipe: bridge_pile_m25, per_output: 1.0 }
  bridge_substructure: { recipe: bridge_substructure_m35, per_output: 1.0 }
  bridge_superstructure: { recipe: bridge_superstructure_m35, per_output: 1.0 }
  flyover_structures: { recipe: flyover_m35, per_output: 1.0 }
  vup_structures: { recipe: vup_m30, per_output: 1.0 }
  # 0.26 cum of RCC per metre: a covered ~600mm drain (100mm base + walls +
  # cover slab) is ~0.25-0.30 cum/m — the old 1.0 consumed a full cubic metre
  # of concrete per metre of drain and made the rate +158% over MoRTH.
  drainage: { recipe: drainage_m25, per_output: 0.26 }
  pipe_culverts: { recipe: pipe_culvert_twin_m, per_output: 1.0 }
  tree_felling: { recipe: tree_felling_no, per_output: 1.0 }
  median_dressing: { recipe: median_dressing_sqm, per_output: 1.0 }
  utility_shifting: { recipe: utility_shift_km, per_output: 1.0 }
