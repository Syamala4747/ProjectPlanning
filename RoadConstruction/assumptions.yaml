# Activities with no purchased-material content. Their direct cost is entirely
# labour + plant + fuel. Only site clearing qualifies — felling, drainage,
# culverts and median dressing all consume materials (compensatory plantation,
# RCC/pipes, topsoil/turfing) and MUST stay mapped above, otherwise their planned
# rate understates the sanctioned scope.
activity_no_material_recipe:
  - site_clearance

# -----------------------------------------------------------------------------
# Material key binding: maps a recipe key (the left side of material_per_unit)
# to (a) the wastage category used to look up the factor above and (b) the entry
# in material_rates_inr that prices it. Where the rate is not per native unit,
# `divisor` converts the recipe unit into the rate's unit — e.g. cement is
# consumed in kg but priced per 50 kg bag, so divisor 50.
# -----------------------------------------------------------------------------
