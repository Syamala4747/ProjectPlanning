# -----------------------------------------------------------------------------
highway_parameters:
  lanes: 4
  formation_width_m: 28.00 # Dual 2-lane + 4.5m median + 2 x 1.5m paved + 2 x 2.0m earthen shoulders
  carriageway_width_m: 18.00 # 2 x (7.5m carriageway + 1.5m paved shoulder)
  median_width_m: 4.50 # Standard median
  subgrade_width_m: 22.00
  gsb_width_m: 20.50
  wmm_width_m: 19.50
  subgrade_thickness_m: 0.50
  gsb_thickness_m: 0.20
  wmm_thickness_m: 0.25
  dbm_thickness_m: 0.100 # 100mm DBM for heavy traffic (>100 MSA)
  bc_thickness_m: 0.050 # 50mm BC modified wearing course
  embankment_avg_height_m: 1.80
  embankment_fill_ratio: 0.75
  excavation_avg_depth_m: 0.75
  excavation_cut_ratio: 0.40
  trees_per_km: 200
  box_culverts_per_km: 1.6
  box_culvert_concrete_cum: 350.0 # 32m barrel across 4-lane
  pipe_culverts_per_km: 1.2
  pipe_culvert_length_m: 64.0 # Twin NP4 1200mm pipes
  minor_bridges_km_interval: 3.0
  major_bridges_km_interval: 12.5
  rob_km_interval: 25.0
  flyover_km_interval: 12.5
  vup_km_interval: 4.0
  pup_km_interval: 6.0
  service_road_ratio: 0.60
  service_road_width_m: 7.0
  slope_coverage_ratio: 0.75

# -----------------------------------------------------------------------------
# MoRTH SDB (2019) RATE ANALYSIS COST COMPONENT SHARES
# -----------------------------------------------------------------------------
cost_breakdown_shares:
  labour_share: 0.18 # 18% of Direct Civil Cost
  material_share: 0.54 # 54% of Direct Civil Cost
  equipment_share: 0.18 # 18% of Direct Civil Cost
  fuel_share: 0.10 # 10% of Direct Civil Cost

# -----------------------------------------------------------------------------
# EPC ACCELERATION & CRASHING FRICTION FACTORS
# -----------------------------------------------------------------------------
crashing_factors:
  equipment_mobilization_pct: 0.03 # 3% of equipment cost per added gang
  shift_overtime_premium_pct: 0.15 # 15% overtime premium for 2nd shift on labor & machinery
  supervision_per_front_pct: 0.02 # 2% extra supervision cost per parallel work front
  site_congestion_factor_pct: 0.01 # 1% efficiency loss from site density per extra crew

# -----------------------------------------------------------------------------
# TIME-DRIVEN ACCELERATION STEP COSTS  (new)
# -----------------------------------------------------------------------------
# The four `crashing_factors` above are pure RATE-PERCENTAGE surcharges: they
# scale with the cost of the work, not with how long the extra capacity must be
# carried. Crashing a 400-day earthwork front and crashing a 6-day culvert front
# therefore cost the SAME percentage, which is why a 410 -> 294 day crash only
# moved cost by ~1.2%.
#
# The parameters below make the surcharge TIME-DRIVEN: it is charged per
# additional work front per DAY that front remains open, and per extra crew for
# the minimum hire period of plant. Faster execution = more parallel fronts +
# more crews held on site longer = materially higher cost, which is what real
# EPC acceleration contracts price.
#
# Basis of each value (INR, India / MoRTH SDB 2019 + CPWD DSR benchmark rates):
#
#   site_establishment_per_front_day = 27,500
#     One extra parallel front needs its own hardstanding/temporary access road,
#     power connection, material stacking area, water point and survey control
#     re-establishment. Priced as the amortised daily share of a ~Rs 8-10 lakh
#     per-front establishment spread over a typical 365-day front.
#     (27,500 x 365 ~ Rs 10.0 lakh/front)
#
#   resident_staff_per_front_day = 16,800
#     An extra front cannot be run off the existing PMO: it needs a resident
#     site engineer, one supervisor, two safety officers and two unskilled
#     mates that are on site for the whole duration of that front.
#     (4,500 + 3,500 + 2 x 2,800 + 2 x 750 = 16,800/day) -- cross-check against
#     `labour_rates_inr_per_day`.
#
#   plant_hire_billing_days = 30
#     Earthmoving / paving / piling plant is hired on a calendar-month minimum
#     by every major contractor in India; a plant mobilised for 8 days is still
#     charged a full month. Used to round each crashed activity duration UP to
#     whole months before charging hire for the extra gangs. (30-day month is
#     the MoRTH/IRC planning-month convention, consistent with the 30-day month
#     used in main.parse_duration_input.)
#
#   gang_interference_pct = 0.04
#     Two gangs working the same front physically interfere: shared access,
#     overlapping haul routes, plant queueing, duplicated survey control and
#     stop-start on wet-weather shutdowns cost ~4% of the labour+equipment+fuel
#     content of the activity per additional gang. The cost of this is
#     SUPER-LINEAR in the number of gangs, so it is applied as
#     (extra_crews ** 1.5): 1 gang +0.0%, 2 gangs +5.7%, 3 gangs +12.5%,
#     4 gangs +20.0% of the exposed content. Beyond 3-4 parallel gangs on a
#     single linear front, productivity collapses - this term is what stops the
#     optimiser from throwing unlimited fleets at a front for marginal gain.
#
# All four are plain data: change them here and every downstream cost, budget
# check and Excel report re-derives. They are applied only when crashing is
# actually happening; `python main.py --no-accel-cost` forces all of them to
# zero to reproduce the legacy cost behaviour on identical input.
# -----------------------------------------------------------------------------
acceleration_step_costs:
  site_establishment_per_front_day: 27500.0
  resident_staff_per_front_day: 16800.0
  plant_hire_billing_days: 30
  gang_interference_pct: 0.04

# -----------------------------------------------------------------------------
# ACTIVITY KEY -> CREW PROFILE MAPPING
# -----------------------------------------------------------------------------
# `crew_composition` and `equipment_per_activity` are keyed by CREW PROFILE,
# but cost/schedule work is keyed by ACTIVITY KEY (the `key:` field of
# `activity_master`). This map translates one to the other so the cost engine can
# derive a per-activity CREW DAY RATE (sum of trade count x labour rate) and a
# PLANT DAY RATE (sum of equipment hire/day) used by the time-driven
# acceleration terms above.
#
# Several activities legitimately share a profile - e.g. GSB and WMM are both
# granular paving by the same spread gang, and all four bituminous courses run
# on the same paver/sprayer gang. Bridge sub- and superstructure share
# `pier_construction` (both are crane + transit-mixer RCC gangs); pile drilling
# is distinct because a bored-pile rig is a major-plant item.
#
# VALIDATION: on load, `CostCalculator` checks that EVERY `activity_master` key
# is either mapped here or explicitly acknowledged in `unmapped_activity_keys`
# below. An unlisted key raises a ValueError naming the offending keys - the
# engine will never silently assume a zero crew/plant day rate, because that
# would understate the acceleration cost.
# -----------------------------------------------------------------------------
crew_profile_by_activity_key:
