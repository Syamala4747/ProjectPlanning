# -----------------------------------------------------------------------------
# Productivity norms - output per day per crew/equipment unit (IS/MoRTH/CPWD)
#
# ###########################################################################
# #  REFERENCE DOCUMENTATION ONLY - NOT READ BY ANY CODE.                   #
# #  Both the cost engine and the duration engine take productivity from   #
# #      activity_master[].productivity_rate                                #
# #  (cost_calculator._resource_planned_rate and duration_calculator both  #
# #  read that field). Editing a value HERE changes nothing - the loader   #
# #  now warns about this block on every run.                              #
# #                                                                        #
# #  Kept as the readable engineering reference behind each activity_master #
# #  rate. Keep it in step by hand, or treat it purely as a comment.        #
# ###########################################################################
# -----------------------------------------------------------------------------
productivity:
  excavation_soil_manual_cum_per_mazdoor_day: 1.0
  excavation_soil_mech_cum_per_excavator_day: 590 # was 800 — not achievable by this gang. The crew is
  # 1 operator x2 + 4 drivers + 2 unskilled + 1 supervisor (Rs 13,800/day) with
  # 1 excavator + 3 tippers + water tanker (Rs 30,000/day) and 42 lph of diesel,
  # i.e. Rs 81,600/day. At 800 cum/day that prices the gang at Rs 102/cum bare
  # (Rs 121 all-in) vs the MoRTH SDB Rs 165/cum — a -27% gap that was pure
  # productivity optimism, not inflation. 800 cum/day needs ~133 tipper trips,
  # i.e. one 6 cum load every 45 min per tipper including load, haul, tip and
  # return. The sanctioned Rs 165/cum implies ~587 cum/day for the same gang, so
  # 590 reproduces the yardstick and is the realistic crew output.
  excavation_rock_cum_per_excavator_day: 150
  embankment_compaction_cum_per_roller_day: 600
  subgrade_prep_cum_per_grader_day: 500
  gsb_cum_per_spread_day: 250
  wmm_cum_per_spread_day: 350
  prime_coat_sqm_per_day: 8000
  tack_coat_sqm_per_day: 10000
  dbm_sqm_per_paver_day: 1200
  bc_sqm_per_paver_day: 1000
  rcc_pour_cum_per_crew_day: 60
  rcc_drain_metre_per_day:
    15 # side-drain/cross-drain gang: ~15 m/day
    # (excavate, PCC bed, RCC U-shape, backfill).
    # Was missing -> config.productivity() returned
    # 0.0 and the DRN activity silently fell back to
    # 1 working day regardless of length_km. Caught
    # by the productivity-key-missing sanity check.
  bar_bending_kg_per_bender_day: 130
  shuttering_sqm_per_carpenter_day: 5.3
  bored_pile_per_rig_day: 1.0
  pier_construction_cum_per_crew_day: 10
  pile_cap_cum_per_crew_day: 25
  psc_girder_per_bed_per_day: 0.125
  girder_erection_per_day: 0.5
  brickwork_cum_per_mason_day: 1.2
  plaster_12mm_sqm_per_mason_day: 10
  building_rcc_cum_per_crew_day: 30
  waterproofing_sqm_per_day: 30
  tiling_sqm_per_day: 15
  painting_sqm_per_day: 20
  electrical_sqm_per_day: 8
  plumbing_sqm_per_day: 8
  hvac_sqm_per_day: 6
  fire_fighting_sqm_per_day: 10
  external_works_sqm_per_day: 50
  ohe_m_per_day:
    500 # single OHE gang: masts + catenary + bonding (m/day).
    # Was wrongly tied to electrical_sqm_per_day (8) — a
    # building-MEP norm applied to linear track-metres, which
    # made 160 km of OHE take 20000 days and every railway
    # plan overflow by ~5x. No IS-code reference on file;
    # conservative vs IR field progression of ~1 km/gang/day.

